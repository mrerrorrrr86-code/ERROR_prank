<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucky Bado.exe 💀</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#080808;
 color:white;
 font-family:Arial,sans-serif;
 display:flex;
 justify-content:center;
 align-items:center;
 min-height:100vh;
 padding:15px;
}

.box{
 width:100%;
 max-width:430px;
 background:#151515;
 border:1px solid #ff2525;
 border-radius:20px;
 padding:30px 20px;
 text-align:center;
 box-shadow:0 0 25px #ff000044;
}

h1{color:#ff2929}
h2{font-size:23px;min-height:65px}

.small{color:#aaa}

button{
 padding:14px 25px;
 margin:10px 5px;
 border:0;
 border-radius:10px;
 font-size:17px;
 font-weight:bold;
 cursor:pointer;
}

.yes{background:#16c75a;color:white}
.no{background:#ff3030;color:white}
.next{background:#ffb000;color:black}

#reaction{
 color:#ff5555;
 min-height:50px;
 font-size:18px;
 font-weight:bold;
 margin:20px 0;
}

#final{display:none}
#quiz{display:block}

.bar{
 height:8px;
 background:#333;
 border-radius:10px;
 margin:20px 0;
 overflow:hidden;
}

#progress{
 width:0;
 height:100%;
 background:red;
}
</style>
</head>

<body>

<div class="box">

<div id="quiz">

<h1>💀 LUCKY BADO</h1>
<p class="small">YES OR NO BEIZZATI CHALLENGE 😂</p>

<div class="bar">
<div id="progress"></div>
</div>

<p id="number">Question 1 / 15</p>

<h2 id="question"></h2>

<button class="yes" onclick="answer('YES')">YES 😂</button>
<button class="no" onclick="answer('NO')">NO 💀</button>

<div id="reaction"></div>

<button class="next" id="next" onclick="nextQuestion()" style="display:none">
NEXT QUESTION ➜
</button>

</div>

<div id="final">

<h1>🏆 CONGRATULATIONS!</h1>

<h2>LUCKY BADO 🤡</h2>

<p>You have officially won the award of...</p>

<h1>MR. NAUTANKI 2026 💀</h1>

<p>99% Drama | 100% Bakwas</p>

<h2>TERE JAISA KOI NAHI! 😂</h2>

<button class="next" onclick="location.reload()">
PLAY AGAIN 🔄
</button>

</div>

</div>

<script>

let questions=[
["Kya tumhara dimaag kabhi kaam karta hai?",
"YES? Aaj toh breaking news hai! 😂",
"NO? Finally ek sachcha jawab! 💀"],

["Kya tum khud ko hero samajhte ho?",
"Hero? Bhai tu cartoon hai! 🤣",
"Kam se kam sach toh bolta hai! 😂"],

["Kya tum handsome ho?",
"Itna confidence kahan se aata hai? 😂",
"Mirror ne bhi reject kar diya? 💀"],

["Kya tum bina wajah overacting karte ho?",
"Bollywood tumhara intezaar kar raha hai! 🎬",
"Ye bhi ek jhooth hai kya? 😂"],

["Kya tum kabhi serious hote ho?",
"Screenshot le lo! Historic moment! 📸",
"Matlab tum 24/7 comedy ho! 🤡"],

["Kya tum intelligent ho?",
"NASA ko inform karo! 🚀",
"Honesty level 100%! 😂"],

["Kya tumhari baatein log sunte hain?",
"Kaun hain woh log? 😂",
"Silence is golden! 💀"],

["Kya tum duniya ke sabse bade nautanki ho?",
"Official confirmation mil gaya! 🤣",
"Abhi bhi denial mein ho? 😂"],

["Kya tum apne aap ko celebrity samajhte ho?",
"Autograph kisko chahiye bhai? 😂",
"Fans ka wait kar rahe ho? 💀"],

["Kya tumhara luck achha hai?",
"Naam Lucky hai, proof bhi do! 😂",
"Naam change karna padega! 🤣"],

["Kya tum kabhi jhooth bolte ho?",
"Pakde gaye! 😂",
"Ye jawab bhi suspicious hai! 💀"],

["Kya tum apne friends ko pareshan karte ho?",
"Public complaint register ho gayi! 🤣",
"Friends ko bulao, inquiry karni hai! 😂"],

["Kya tum khud ko intelligent samajhte ho?",
"Confidence toh dekho! 💀",
"Self-awareness unlocked! 😂"],

["Kya tumhari harkatein normal hain?",
"Normal ka definition change karna padega! 🤣",
"Finally duniya bach gayi! 😂"],

["Kya tum Lucky Bado ho?",
"Case solved! 😂",
"Identity hide karne se kya hoga? 💀"]
];

let current=0;

function loadQuestion(){

 document.getElementById("question").innerText=
 questions[current][0];

 document.getElementById("number").innerText=
 "Question "+(current+1)+" / 15";

 document.getElementById("progress").style.width=
 (current/15*100)+"%";

 document.getElementById("reaction").innerText="";
 document.getElementById("next").style.display="none";

 document.querySelectorAll(".yes,.no").forEach(b=>{
 b.disabled=false;
 b.style.opacity="1";
 });

}

function answer(value){

 let reply=value==="YES"?questions[current][1]:questions[current][2];

 document.getElementById("reaction").innerText=reply;

 document.getElementById("next").style.display="inline-block";

 document.querySelectorAll(".yes,.no").forEach(b=>{
 b.disabled=true;
 b.style.opacity=".5";
 });

}

function nextQuestion(){

 current++;

 if(current<questions.length){
 loadQuestion();
 }else{
 document.getElementById("quiz").style.display="none";
 document.getElementById("final").style.display="block";
 }
}

loadQuestion();

</script>

</body>
</html>
